<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rating paradigm - slider ratings</title>

    <script src="https://unpkg.com/jspsych@6.3.1/jspsych.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-html-keyboard-response.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-html-slider-response.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-html-button-response.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-image-button-response.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-image-slider-response.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-fullscreen.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-preload.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-call-function.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-survey-multi-choice.js"></script>
    <script src="https://unpkg.com/jspsych@6.3.1/plugins/jspsych-survey-text.js"></script>
    <link href="https://unpkg.com/jspsych@6.3.1/css/jspsych.css" rel="stylesheet" type="text/css">

    <script src="utils.js"></script>
</head>
<body style="background-color:grey;">

  <script>
    
    const visualAngle = 8; // Image size on the screen. Bigger number = bigger image.
    const viewingDistance = 20; // Approximate viewing distance in inches.
    const stimulusSize = calculateStimulusSize(visualAngle, viewingDistance);
    const spaceBetweenLabels = calculateStimulusSize(8, viewingDistance) / 2;
    
    // ===== STUDENTS: EDIT THIS SECTION =====
    // This is a Rating task.
    // The participant sees one image, then moves a slider from 1 to 5.
    //
    // val = image numbers to show.
    // Example: 7 means the task will show ../../images/social_ratings/im7.jpg
    //
    // To test your own images:
    // 1. Put the images in ../../images/social_ratings/
    // 2. Name them im0.jpg, im1.jpg, im2.jpg, etc.
    // 3. Change val to the numbers you want to show.
    let val =[7, 2, 15, 0, 18];


    let images = [];
    for (let i = 0; i < val.length; i++) {
        images.push(`../../images/ratings/im${val[i]}.jpg`);
    }
    
    // Timeline: this is the list of screens shown to the participant.
    let timeline = [];
    
    // Load images before the task starts. This helps avoid delays during the task.
    let preload = {
        type: 'preload',
        images: images,
        message: '<div style="font-size: 24px; text-align: center;"><strong>Loading the experiment... (1/2)</strong></div>',
        show_progress_bar: true
    };
    timeline.push(preload);
    
    timeline.push(fullscreen);
    timeline.push(consent_form);
    timeline.push(intro_info);
    timeline.push(survey);

    // Welcome page: explain the task in simple words.
    var welcome = {
        type: "html-keyboard-response",
        stimulus: "<div style='font-size: 24px; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center;'>" +
          "<div style='display: block;'>" +
          "<span style='font-weight: bold;'>Welcome!</span><br><br>" +
          "In this task, you will see one image. Then you will move a slider to give a rating from 1 to 5.<br><br>" +
          "Please look at the center <span style='font-weight: bold;'>+</span> before each image appears.<br><br>" +
          "<span style='font-weight: bold;'>Press any key to begin.</span></div></div>"
    };
    timeline.push(welcome);
    
    // These variables count performance during the task.
    let correctResponses = 0;
    let trialCount = 0;
    
    // Trial loop: this repeats the same steps for every image.
    for (let i = 0; i < images.length; i++) {

        // 1/5 Fixation: participant looks at the center cross.
        timeline.push({
            type: 'html-keyboard-response',
            stimulus: '<div style="font-size: 60px;">+</div>',
            choices: jsPsych.NO_KEYS,
            trial_duration: 500
        });

        // 2/5 Image: show the image briefly.
        timeline.push({
            type: 'image-button-response',
            stimulus: images[i],
            stimulus_height: stimulusSize,
            choices: [],
            trial_duration: 100,
            data: { trial_index: i }
        });

        // 3/5 Blank screen: short pause after the image.
        timeline.push({
            type: 'html-keyboard-response',
            stimulus: '',
            choices: jsPsych.NO_KEYS,
            trial_duration: 100
        });

        // 4/5 Rating screen: participant moves the slider.
        timeline.push({
            type: 'html-slider-response',
            stimulus: "<p>Move the slider to give your rating.</p><p id='demo'></p>", // Use the same video as in the previous trial for reference
            slider_width: stimulusSize,
            require_movement: true,
            prompt: "",
            labels: ['1', '5'],
            min: 1,
            max: 5,
            trial_duration: 8000,
            button_label: "CONTINUE",
            slider_start: function() {
                return Math.floor(getRandomArbitrary(1, 5));
            },
            step: 1})

        // 5/5 Short pause before the next trial.
        timeline.push({
            type: 'html-keyboard-response',
            stimulus: '',
            choices: jsPsych.NO_KEYS,
            trial_duration: 1000
        })
    };

    // Start the experiment and save the data at the end.
    jsPsych.init({
        timeline: timeline,
        show_progress_bar: true,
        on_finish: function() {
                    var csv = jsPsych.data.get().csv();
                    let subject_id = Math.floor(100000 + Math.random() * 900000); // random 6-digit participant ID
                    var filename = 'ratings_' + subject_id + '.csv';
                    downloadCSV(csv, filename);
                }
    });
    
  </script>
</body>
</html>
